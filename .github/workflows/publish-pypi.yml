name: Publish reviewed distribution to PyPI

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed commit SHA on main (must match the selected main revision)
        required: true
        type: string
      version:
        description: Reviewed package version (must match pyproject.toml)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Bind build to reviewed source and version
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, re, subprocess, tomllib
          from pathlib import Path
          expected = os.environ['EXPECTED_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', expected):
              raise SystemExit('source_sha must be a full lowercase commit SHA')
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != expected:
              raise SystemExit('selected main revision differs from reviewed SHA')
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          if project['name'] != 'lookfirst' or project['version'] != os.environ['EXPECTED_VERSION']:
              raise SystemExit('package name/version differs from reviewed candidate')
          PY
      - name: Install build and test dependencies
        run: python -m pip install 'setuptools==78.1.1' 'twine>=6,<7' . pytest
      - name: Test reviewed source
        run: python -m pytest -q
      - name: Build only this run's distributions
        env:
          LOOKFIRST_DIST_DIR: ${{ runner.temp }}/lookfirst-dist
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python tools/build_dist.py
          python -m twine check "$LOOKFIRST_DIST_DIR"/*
          python tools/check_release_dist.py "$LOOKFIRST_DIST_DIR" "$EXPECTED_VERSION"
          sha256sum "$LOOKFIRST_DIST_DIR"/* >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: artifact
        with:
          name: reviewed-pypi-distributions
          path: ${{ runner.temp }}/lookfirst-dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/lookfirst/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Publish the reviewed artifact set using OIDC
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
